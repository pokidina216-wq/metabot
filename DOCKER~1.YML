# ── Vexis — Docker Compose (VPS / self-host) ──
# Запуск:
#   1) cp .env.example .env  &&  заполнить секреты (СИЛЬНЫЕ пароли!)
#   2) docker compose up -d
#
# Безопасность (Stage 0):
#   • Postgres/Redis НЕ публикуются наружу (нет ports:), только внутр. сеть.
#   • Redis под паролем (--requirepass).
#   • Пароли обязательны (нет слабых дефолтов) — берутся из .env.
#   • Контейнер бота non-root, cap_drop ALL, no-new-privileges, healthcheck.
#
# Для деплоя на Railway этот файл НЕ нужен — там Postgres/Redis отдельные
# плагины, а бот собирается из Dockerfile (см. README → раздел Railway).

services:
  # ── PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vexis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a STRONG POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт наружу НЕ публикуем. Доступ — только внутри vexis_net.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vexis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - vexis_net

  # ── Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vexis_redis
    restart: unless-stopped
    # Пароль ОБЯЗАТЕЛЕН. maxmemory + LRU для кэша.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set a STRONG REDIS_PASSWORD in .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    networks:
      - vexis_net

  # ── Миграции (запускаются один раз перед стартом бота) ──
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vexis_migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    security_opt:
      - no-new-privileges:true
    networks:
      - vexis_net
    restart: "no"

  # ── Vexis Bot ────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vexis_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - bot_logs:/app/logs
    # Polling: порты наружу не нужны. health-сервер слушает 8081 внутри сети.
    # Webhook: раскомментировать ports и nginx ниже, синхронизировать порт.
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - vexis_net
    # Для webhook: command: ["python", "bot.py", "--webhook"]

  # ── Nginx (только для webhook) ───────────────
  # Раскомментировать при использовании webhook.
  # nginx:
  #   image: nginx:alpine
  #   container_name: vexis_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
  #     - ./nginx/ssl:/etc/nginx/ssl
  #   depends_on:
  #     - bot
  #   networks:
  #     - vexis_net

volumes:
  postgres_data:
  redis_data:
  bot_logs:

networks:
  vexis_net:
    driver: bridge
