# ── Vexis Nginx — Reverse Proxy для Webhook ──
# Положить SSL-сертификаты в nginx/ssl/

# Порт синхронизирован с WEB_SERVER_PORT бота (по умолчанию 8080).
upstream vexis_backend {
    server bot:8080;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name YOUR_DOMAIN.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN.com;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Оптимальные SSL параметры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Webhook endpoint (путь синхронизирован с WEBHOOK_PATH=/webhook)
    location /webhook {
        proxy_pass http://vexis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Максимальный размер тела запроса (для файлов)
        client_max_body_size 50M;
    }

    # Deny all other paths
    location / {
        return 404;
    }
}
